AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Common OAuth components for the Identity Reuse Service

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - local
      - dev
      - build
      - staging
      - integration
      - production
    Default: local

  AccessTokenIndexWithEventDataIpvIndexName:
    Type: String
    Description: >
      Sets the name of the Access Token Index With Event Data Ipv Global
      Secondary Index (GSI) when the AuthorizationRequestType parameter is set
      to "IPV".
    Default: access-token-index-with-event-data-ipv

  ApiStageName:
    Description: The stage name of the API
    Type: String
    Default: v1

  AuditComponentId:
    Description: The component ID used for audit events
    Type: String
    Default: https://identity.account.gov.uk/sis

  AuditEventNamePrefix:
    Description: The prefix used for the event name of an audit event
    Type: String
    Default: SIS

  CodeSigningConfigArn:
    Description: The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Type: String
    Default: none

  CommitSha:
    Description: "Commit SHA supplied by the deployment pipeline"
    Type: String
    Default: ""

  LambdaDeploymentPreference:
    Description: "Specifies the configuration to enable gradual Lambda deployments."
    Type: String
    Default: "AllAtOnce"
    AllowedValues:
      - AllAtOnce
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
      - Canary10Percent15Minutes
      - Canary10Percent30Minutes
      - Linear10PercentEvery10Minutes
      - Linear10PercentEvery1Minute
      - Linear10PercentEvery2Minutes
      - Linear10PercentEvery3Minutes
      - LambdaCanary50Percent5Minutes

  MainCloudWatchMetricNamespace:
    Description: The name of the metric namespace
    Type: String
    Default: IdentityReuseService

  PermissionsBoundary:
    Description: The ARN of the permissions boundary to apply to any role created by the template
    Type: String
    Default: none

  OAuthClientId:
    Description: "The client ID used by the main OAuth client"
    Type: String
    Default: "orchestrator"

  OwnerTagValue:
    Description: Value for the Owner Tag
    Type: String
    Default: trust_and_reuse@digital.cabinet-office.gov.uk

  ProductTagValue:
    Description: Value for the Product Tag
    Type: String
    Default: GOV.UK One Login

  SharedStackName:
    Description: The name of the Identity Reuse Service Shared Stack
    Type: String
    Default: reuse-identity-shared

  SourceTagValue:
    Description: Value for the Source Tag
    Type: String
    Default: govuk-one-login/ipv-identity-reuse-service/infrastructure/oauth-internal/template.yaml

  SystemTagValue:
    Description: Value for the System Tag
    Type: String
    Default: Re-use identity service

  VpcStackName:
    Description: The name of the stack containing VPC infrastructure
    Type: String
    Default: spoke-vpc

  OrchestrationJwksEndpointOverride:
    Type: String
    Description: Override for the default OrchestrationJwksEndpoint for the environment
    Default: none

  OrchestrationRedirectURIOverride:
    Type: String
    Description: Override for the default OrchestrationRedirectURI for the environment
    Default: none

Mappings:
  EnvironmentMap:
    "local":
      DynatraceLayerArn: "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1"
      DynatraceSecretArn: "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables" # pragma: allowlist secret
      LogGroupRetentionInDays: 30
      OrchestrationIssuer: "orchestrator"
      OrchestrationJwksEndpoint: "https://orch.reuse.dev.stubs.account.gov.uk/.well-known/jwks.json"
      OrchestrationRedirectURI: "https://orch.reuse.dev.stubs.account.gov.uk"
      SISAudience: "https://reuse-identity.dev.account.gov.uk"
    "dev":
      DynatraceLayerArn: "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1"
      DynatraceSecretArn: "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables" # pragma: allowlist secret
      LogGroupRetentionInDays: 30
      OrchestrationIssuer: "orchestrator"
      OrchestrationJwksEndpoint: "https://orch.reuse.dev.stubs.account.gov.uk/.well-known/jwks.json"
      OrchestrationRedirectURI: "https://orch.reuse.dev.stubs.account.gov.uk"
      SISAudience: "https://reuse-identity.dev.account.gov.uk"
    "build":
      DynatraceLayerArn: "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1"
      DynatraceSecretArn: "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables" # pragma: allowlist secret
      LogGroupRetentionInDays: 30
      OrchestrationIssuer: "orchestrator"
      OrchestrationJwksEndpoint: "https://orch.reuse.stubs.account.gov.uk/.well-known/jwks.json"
      OrchestrationRedirectURI: "https://orch.reuse.stubs.account.gov.uk"
      SISAudience: "https://reuse-identity.build.account.gov.uk"
    "staging":
      DynatraceLayerArn: "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1"
      DynatraceSecretArn: "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables" # pragma: allowlist secret
      LogGroupRetentionInDays: 90
      OrchestrationIssuer: "orchestrator"
      OrchestrationJwksEndpoint: none
      OrchestrationRedirectURI: "https://orch.reuse.stubs.account.gov.uk"
      SISAudience: "https://reuse-identity.staging.account.gov.uk"
    "integration":
      DynatraceLayerArn: "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1"
      DynatraceSecretArn: "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables" # pragma: allowlist secret
      LogGroupRetentionInDays: 90
      OrchestrationIssuer: "orchestrator"
      OrchestrationJwksEndpoint: none
      OrchestrationRedirectURI: none
      SISAudience: "https://reuse-identity.integration.account.gov.uk"
    "production":
      DynatraceLayerArn: "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1"
      DynatraceSecretArn: "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables" # pragma: allowlist secret
      LogGroupRetentionInDays: 180
      OrchestrationIssuer: "orchestrator"
      OrchestrationJwksEndpoint: none
      OrchestrationRedirectURI: none
      SISAudience: "https://reuse-identity.account.gov.uk"

Conditions:
  DynaTraceEnabled:
    Fn::Or:
      - Fn::Equals: [ !Ref Environment, "build" ]
      - Fn::Equals: [ !Ref Environment, "staging" ]
      - Fn::Equals: [ !Ref Environment, "integration" ]
      - Fn::Equals: [ !Ref Environment, "production" ]

  IsDev:
    Fn::Or:
      - Fn::Equals: [ !Ref Environment, "local" ]
      - Fn::Equals: [ !Ref Environment, "dev" ]

  IsDevOrBuild:
    Fn::Or:
      - Fn::Equals: [ !Ref Environment, "local" ]
      - Fn::Equals: [ !Ref Environment, "dev" ]
      - Fn::Equals: [ !Ref Environment, "build" ]

  IsNotDevOrBuild:
    Fn::Not:
      - !Condition IsDevOrBuild

  IsNotProduction:
    Fn::Or:
      - Fn::Equals: [ !Ref Environment, "local" ]
      - Fn::Equals: [ !Ref Environment, "dev" ]
      - Fn::Equals: [ !Ref Environment, "build" ]
      - Fn::Equals: [ !Ref Environment, "staging" ]
  UseCodeSigning:
    Fn::Not:
      - Fn::Equals:
          - !Ref CodeSigningConfigArn
          - none
  UsePermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - !Ref PermissionsBoundary
          - none

  IsOrchestrationJwksEndpointOverridden:
    Fn::Not:
      - Fn::Equals: [ !Ref OrchestrationJwksEndpointOverride, "none" ]

  IsOrchestrationRedirectURIOverridden:
    Fn::Not:
      - Fn::Equals: [ !Ref OrchestrationRedirectURIOverride, "none" ]

  UseVpc:
    Fn::Not:
      - Fn::Equals: [!Ref VpcStackName, "none"]

Resources:
  OAuthCommon:
    Type: AWS::Serverless::Application
    Condition: IsNotProduction
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:eu-west-2:667736788427:applications/di-ipv-cri-oauth-common
        SemanticVersion: 1.6.0
      Parameters:
        AccessTokenIndexWithEventDataIpvIndexName: !Ref AccessTokenIndexWithEventDataIpvIndexName
        AuditEventNamePrefix: !Ref AuditEventNamePrefix
        AuthorizationRequestType: "IPV"
        AuditTxmaStackName: !Ref SharedStackName # TXMA infrastructure lives in the reuse-identity-shared stack
        CSLSDestinationArn: "none"
        CriIdentifier: !Ref MainCloudWatchMetricNamespace # Used for the metrics namespace and metrics service names only
        CriAudience: !FindInMap [ EnvironmentMap, !Ref Environment, SISAudience ] # Sets the Audience value for the SIS OAuth 2.0 server
        CriVcIssuer: !Ref AuditComponentId # Used for the component ID in audit events only
        CriPrivateApiGwName: !Sub "${AWS::StackName}-PrivateApi" # Used to create canary deployment alarms for the stack
        CriPublicApiGwName: !Sub "${AWS::StackName}-PrivateApi" # This will become the external facing private API when the /token endpoint moves there
        Environment: !If [IsDev, dev, !Ref Environment ]
        IPVCoreRedirectURI: !If
          - IsOrchestrationRedirectURIOverridden
          - !Ref OrchestrationRedirectURIOverride
          - !FindInMap [ EnvironmentMap, !Ref Environment, OrchestrationRedirectURI ] # The expected client redirect URI (used in staging upwards)
        IPVCoreStubJwksEndpoint: !If
          - IsOrchestrationJwksEndpointOverridden
          - !Ref OrchestrationJwksEndpointOverride
          - !FindInMap [ EnvironmentMap, !Ref Environment, OrchestrationJwksEndpoint ] # The expected client JWKS endpoint (used in non-prod)
        IsCredentialIssuer: "false"
        LambdaCodeSigningConfigArn: !Ref CodeSigningConfigArn
        LambdaDeploymentPreference: !Ref LambdaDeploymentPreference
        LambdaVersionHash: !Ref CommitSha
        LambdaVpcConfiguration: "di-devplatform-deploy"
        LogRetention: !FindInMap [ EnvironmentMap, !Ref Environment, LogGroupRetentionInDays]
        PermissionsBoundaryArn: !Ref PermissionsBoundary
        VpcStackNameOverride: !Ref VpcStackName

  PrivateApi:
    Type: AWS::Serverless::Api
    Condition: IsNotProduction
    Properties:
      Name: !Sub "${AWS::StackName}-PrivateApi"
      AlwaysDeploy: true
      OpenApiVersion: 3.0.3
      PropagateTags: true
      DefinitionBody:
        openapi: "3.0.3" # workaround to get `sam validate` to work
        paths: # workaround to get `sam validate` to work
          /never-created:
            options: { } # workaround to get `sam validate` to work
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: "../../openAPI/oauth-common-private-api.yaml"
      Description: "A private API internal to SIS to serve the OAuth Common helper endpoints"
      StageName: !Ref ApiStageName
      Auth:
        ResourcePolicy:
          IntrinsicVpcWhitelist:
            - Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
      AccessLogSetting:
        Format: >-
          {
          "requestId": "$context.requestId",
          "requestTime": "$context.requestTime",
          "requestTimeEpoch": "$context.requestTimeEpoch",
          "httpMethod": "$context.httpMethod",
          "domainName": "$context.domainName",
          "path": "$context.path",
          "routeKey": "$context.routeKey",
          "protocol": "$context.protocol",
          "status": "$context.status",
          "responseLength": "$context.responseLength",
          "responseLatency": "$context.responseLatency",
          "authorizerLatency": "$context.authorizer.latency",
          "integrationStatus": "$context.integrationStatus",
          "integrationLatency": "$context.integrationLatency",
          "integrationErrorMessage": "$context.integrationErrorMessage",
          "errorMessage": "$context.error.message",
          "errorResponseType": "$context.error.responseType",
          "validationErrorString": "$context.error.validationErrorString",
          "xrayTraceId": "$context.xrayTraceId",
          "apiKeyId": "$context.identity.apiKeyId"
          }
        DestinationArn: !GetAtt PrivateApiAccessLogGroup.Arn
      CacheClusterEnabled: false
      TracingEnabled: true
      MethodSettings:
        - MetricsEnabled: true
          LoggingLevel: INFO
          ResourcePath: /*
          HttpMethod: "*"
      EndpointConfiguration:
        Type: PRIVATE
      Tags:
        Product: !Ref ProductTagValue
        System: !Ref SystemTagValue
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        FMSRegionalPolicy: false
        CustomPolicy: idprivateapi

  PrivateApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotProduction
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-PrivateApi/${ApiStageName}"
      RetentionInDays: !FindInMap [ EnvironmentMap, !Ref Environment, LogGroupRetentionInDays]
      KmsKeyId: !GetAtt CloudWatchEncryptionKey.Arn
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Name
          Value: !Sub "/aws/apigateway/${AWS::StackName}-PrivateApi/${ApiStageName}"

  CloudWatchEncryptionKey:
    Type: AWS::KMS::Key
    Condition: IsNotProduction
    Properties:
      Description: AWS KMS key for encrypting CloudWatch logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Name
          Value: !Sub "${AWS::StackName}-CloudWatchEncryptionKey"

  AccessTokenIndexWithEventDataIpvIndexNameParameter:
    Type: AWS::SSM::Parameter
    Condition: IsNotProduction
    Properties:
      Name: !Sub "/${OAuthCommon.Outputs.StackName}/AccessTokenIndexWithEventDataIpvIndexName"
      Type: String
      Value: !Ref AccessTokenIndexWithEventDataIpvIndexName

  OrchestrationStubAuthenticationAlgParameter:
    Type: AWS::SSM::Parameter
    Condition: IsNotProduction
    Properties:
      Name: !Sub "/${OAuthCommon.Outputs.StackName}/clients/${OAuthClientId}/jwtAuthentication/authenticationAlg"
      Type: String
      Value: ES256

  OrchestrationStubAudienceParameter:
    Type: AWS::SSM::Parameter
    Condition: IsNotProduction
    Properties:
      Name: !Sub "/${OAuthCommon.Outputs.StackName}/clients/${OAuthClientId}/jwtAuthentication/audience"
      Type: String
      Value: !FindInMap [ EnvironmentMap, !Ref Environment, SISAudience ]

  OrchestrationStubIssuerParameter:
    Type: AWS::SSM::Parameter
    Condition: IsNotProduction
    Properties:
      Name: !Sub "/${OAuthCommon.Outputs.StackName}/clients/${OAuthClientId}/jwtAuthentication/issuer"
      Type: String
      Value: !FindInMap [EnvironmentMap, !Ref "Environment", OrchestrationIssuer]

  OrchestrationStubRedirectURIParameter:
    Type: AWS::SSM::Parameter
    Condition: IsNotProduction
    Properties:
      Name: !Sub "/${OAuthCommon.Outputs.StackName}/clients/${OAuthClientId}/jwtAuthentication/redirectUri"
      Type: String
      Value: !If
        - IsOrchestrationRedirectURIOverridden
        - !Ref OrchestrationRedirectURIOverride
        - !FindInMap [ EnvironmentMap, !Ref Environment, OrchestrationRedirectURI ]

  OrchestrationStubJwksEndpointParameter:
    Type: AWS::SSM::Parameter
    Condition: IsNotProduction
    Properties:
      Name: !Sub "/${OAuthCommon.Outputs.StackName}/clients/${OAuthClientId}/jwtAuthentication/jwksEndpoint"
      Type: String
      Value: !If
        - IsOrchestrationJwksEndpointOverridden
        - !Ref OrchestrationJwksEndpointOverride
        - !FindInMap [ EnvironmentMap, !Ref Environment, OrchestrationJwksEndpoint ]

  ##################################
  # API GATEWAY AUTHORIZER HANDLER #
  ##################################
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      PermissionsBoundary: !If [ UsePermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue ]
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Name
          Value: !Sub "${AWS::StackName}-CodeDeployServiceRole"

  ProtectedResourceAuthorizerFunction:
    Condition: IsNotProduction
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ProtectedResourceAuthorizerFunctionArn"
      Description: "Authorizes requests and redirects to appropriate Lambda"
      Timeout: 5
      Handler: api-gateway-protected-resource-authorizer-handler.handler
      Role: !GetAtt ProtectedResourceAuthorizerFunctionRole.Arn
      MemorySize: 2048
      CodeUri: ../../src
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: !If [DynaTraceEnabled, "/opt/dynatrace", !Ref "AWS::NoValue"]
          DT_CONNECTION_AUTH_TOKEN: !If
            - DynaTraceEnabled
            - !Sub
              - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_AUTH_TOKEN}}" # pragma: allowlist secret
              - SecretArn: !FindInMap [EnvironmentMap, !Ref Environment, DynatraceSecretArn]
            - !Ref "AWS::NoValue"
          DT_CONNECTION_BASE_URL: !If
            - DynaTraceEnabled
            - !Sub
              - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_BASE_URL}}" # pragma: allowlist secret
              - SecretArn: !FindInMap [EnvironmentMap, !Ref Environment, DynatraceSecretArn]
            - !Ref "AWS::NoValue"
          DT_CLUSTER_ID: !If
            - DynaTraceEnabled
            - !Sub
              - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CLUSTER_ID}}" # pragma: allowlist secret
              - SecretArn: !FindInMap [EnvironmentMap, !Ref Environment, DynatraceSecretArn]
            - !Ref "AWS::NoValue"
          DT_LOG_COLLECTION_AUTH_TOKEN: !If
            - DynaTraceEnabled
            - !Sub
              - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_LOG_COLLECTION_AUTH_TOKEN}}" # pragma: allowlist secret
              - SecretArn: !FindInMap [EnvironmentMap, !Ref Environment, DynatraceSecretArn]
            - !Ref "AWS::NoValue"
          DT_TENANT: !If
            - DynaTraceEnabled
            - !Sub
              - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_TENANT}}" # pragma: allowlist secret
              - SecretArn: !FindInMap [EnvironmentMap, !Ref Environment, DynatraceSecretArn]
            - !Ref "AWS::NoValue"
          DT_OPEN_TELEMETRY_ENABLE_INTEGRATION: !If [DynaTraceEnabled, "true", !Ref "AWS::NoValue"]
          SESSION_TABLE_NAME: !GetAtt OAuthCommon.Outputs.DbSessionTableName
          SESSION_TABLE_ACCESSTOKEN_INDEX: !GetAtt AccessTokenIndexWithEventDataIpvIndexNameParameter.Value
          POWERTOOLS_METRICS_NAMESPACE: !Ref AWS::StackName
          POWERTOOLS_SERVICE_NAME: "AuthorizerFunction"
      CodeSigningConfigArn: !If
        - UseCodeSigning
        - !Ref CodeSigningConfigArn
        - !Ref AWS::NoValue
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      VpcConfig: !If
        - UseVpc
        - SecurityGroupIds:
            - Fn::ImportValue: !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
          SubnetIds:
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnetIdA"
            - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnetIdB"
        - !Ref "AWS::NoValue"
      Tracing: Active
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      AutoPublishCodeSha256: !Ref CommitSha
      Layers: !If
        - DynaTraceEnabled
        - - !FindInMap [EnvironmentMap, !Ref Environment, DynatraceLayerArn]
        - !Ref AWS::NoValue
      DeploymentPreference:
        Type: !Ref LambdaDeploymentPreference
        Role: !GetAtt CodeDeployServiceRole.Arn
        Alarms:
          Fn::If:
            - IsNotProduction
            - - !Ref ProtectedResourceAuthorizerFunctionLambdaErrorAlarm
            - - !Ref "AWS::NoValue"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        UseNpmCi: True
        Minify: true
        Target: es2022
        Sourcemap: true
        SourcesContent: false
        EntryPoints:
          - handlers/api-gateway-protected-resource-authorizer-handler/api-gateway-protected-resource-authorizer-handler.ts
        Format: esm
        Platform: node
        OutExtension:
          - .js=.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  ProtectedResourceAuthorizerFunctionRole:
    Condition: IsNotProduction
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ProtectedResourceAuthorizerFunctionRole"
      Description: !Sub "The role assumed by the ${AWS::StackName}-ProtectedResourceAuthorizerFunction"
      PermissionsBoundary: !If [ UsePermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue ]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  ProtectedResourceAuthorizerFunctionPolicy:
    Condition: IsNotProduction
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-ProtectedResourceAuthorizerFunctionPolicy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource:
              - !GetAtt ProtectedResourceAuthorizerFunctionLogGroup.Arn
          - Effect: Allow
            Action:
              - "cloudwatch:PutMetricData"
            Resource:
              - "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: !Ref AWS::StackName
          - Effect: Allow
            Action:
              - "dynamodb:Query"
            Resource:
              - Fn::Sub:
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*"
                - TableName: !GetAtt OAuthCommon.Outputs.DbSessionTableName
          - Effect: Allow
            Action:
              - "kms:Decrypt"
            Resource:
              - Fn::Sub:
                  - "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/${KeyID}"
                  - KeyID: !GetAtt OAuthCommon.Outputs.DbCustomerManagedKeyID
      Roles:
        - !Ref ProtectedResourceAuthorizerFunctionRole

  ProtectedResourceAuthorizerFunctionLogGroup:
    Condition: IsNotProduction
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [ IsDev, Delete, Retain ]
    UpdateReplacePolicy: !If [ IsDev, Delete, Retain ]
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProtectedResourceAuthorizerFunction}"
      RetentionInDays: !FindInMap [EnvironmentMap, !Ref Environment, LogGroupRetentionInDays]
      KmsKeyId: !GetAtt CloudWatchEncryptionKey.Arn
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Name
          Value: !Sub "/aws/lambda/${ProtectedResourceAuthorizerFunction}"

  ProtectedResourceAuthorizerFunctionLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotProduction
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ProtectedResourceAuthorizerFunctionLambdaErrorAlarm"
      AlarmDescription: "Errors invoking lambda authorizer function"
      Metrics:
        - Id: m1
          Label: ProtectedResourceAuthorizerFunction Errors
          MetricStat:
            Metric:
              MetricName: Errors
              Namespace: AWS/Lambda
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ProtectedResourceAuthorizerFunction
            Period: 60
            Stat: Sum
            Unit: Count
          ReturnData: true
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching
      ActionsEnabled:
        Fn::If:
          - IsNotDevOrBuild
          - TRUE
          - FALSE
      AlarmActions:
        - !ImportValue alerting-integration-AlertNotificationTopicArn
      OKActions:
        - !ImportValue alerting-integration-AlertNotificationTopicArn

Outputs:
  PrivateApi:
    Condition: IsNotProduction
    Description: "The URL for the OAuth internal private API"
    Value: !Sub "https://${PrivateApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"
    Export:
      Name: !Sub "${AWS::StackName}-PrivateApi"

  AccessTokenFunctionName:
    Condition: IsNotProduction
    Description: "The OAuth token function"
    Value: !GetAtt OAuthCommon.Outputs.LambdaAccessTokenFunctionName
    Export:
      Name: !Sub "${AWS::StackName}-AccessTokenFunctionName"

  ProtectedResourceAuthorizerFunctionArn:
    Condition: IsNotProduction
    Description: "The ARN of the authorizer function to attach to protected resources"
    Value: !Ref ProtectedResourceAuthorizerFunction.Alias
    Export:
      Name: !Sub "${AWS::StackName}-ProtectedResourceAuthorizerFunctionArn"
